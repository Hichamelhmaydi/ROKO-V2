spring:
  datasource:
    url: ${DB_URL:jdbc:postgresql://postgres:5432/roko_db}
    username: ${DB_USERNAME:postgres}
    password: ${DB_PASSWORD:abc}
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: 5
      minimum-idle: 2
      connection-timeout: 20000

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false
    properties:
      hibernate:
        format_sql: false
        dialect: org.hibernate.dialect.PostgreSQLDialect
        jdbc:
          batch_size: 20
          fetch_size: 50

  servlet:
    multipart:
      enabled: true
      max-file-size: 10MB
      max-request-size: 10MB

server:
  port: 8080
  servlet:
    context-path: /

jwt:
  secret: ${JWT_SECRET:404E635266556A586E3272357538782F413F4428472B4B6250645367566B5970}
  expiration: 86400000

stripe:
  api:
    key: ${STRIPE_API_KEY:sk_test_placeholder}
  webhook:
    secret: ${STRIPE_WEBHOOK_SECRET:}
  success:
    url: http://localhost:4200/payment/success
  cancel:
    url: http://localhost:4200/payment/cancel

file:
  upload-dir: ${FILE_UPLOAD_DIR:uploads}

logging:
  level:
    root: INFO
    com.example.roko: INFO
  file:
    name: logs/roko.log
    max-size: 10MB
    max-history: 30
